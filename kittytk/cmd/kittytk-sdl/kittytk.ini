; kittytk.ini - configuration for the KittyTK display host.
;
; Edit this file in a text editor (e.g. Notepad), save, then relaunch
; kittytk-sdl.exe. No command line needed.
;
; The host uses the first kittytk.ini it finds, in this order:
;   1. the folder you run it from
;   2. the folder holding kittytk-sdl.exe   <- this file
;   3. your user config folder (%APPDATA%\kittytk on Windows)
;
; Lines starting with ; or # are comments. Section headers ([window],
; [service]) are just for tidiness - the settings work with or without them.

[window]
; Window title bar text.
title  = KittyTK
; Window size in pixels.
width  = 1024
height = 768
; Pixels per unit: 1 = small, 2 = crisp and larger. Try 1 on small screens.
scale  = 2
; UI font point size. Sizes the whole desktop's cell grid: larger makes
; text and text-sized controls bigger (12 = default). This is independent
; of scale - scale is pixel density, font_size is the type size.
font_size = 12
; Graphical window frame border thickness, in device pixels. The border
; is drawn AND reserved outside the window's interior, so a thicker border
; makes the usable content area smaller (or needs a bigger window). Blank
; or 0 keeps the default thin frame.
border_width =
; Which keys are treated as window accelerators rather than passed to whatever
; has focus. A pattern, not a list: M-* claims every Meta combination, so a
; focused text field still receives ordinary typing while M-F4 reaches the
; window manager.
accelerator_chord = M-*
; Show the render frame rate in the OS title bar (kittytk-sdl only).
;   true  -> append " - N fps" to the window title, updated once a second.
;            This runs a continuous repaint (burn) loop so the reading is a
;            steady, vsync-paced rate (usually the monitor refresh) - handy
;            for measurement, but it uses CPU/GPU even when the desktop is idle.
;   blank -> off (default). The desktop repaints only on change, no burn loop.
fps =
; Sync presents to the display refresh. On by default (smooth, no tearing,
; caps the frame rate at the monitor refresh). Set false to uncap - with
; fps=true this lets the reading climb past the refresh to show raw throughput.
vsync =

; Desktop wallpaper: a PNG, JPEG or GIF. By default it is drawn at its own
; size and repeated across the desktop; the wallpaper_* keys below change
; that. Any size works — the GPU compositor tiles it in its sampler, so a
; 32x32 weave and a 1024x1024 photograph cost the same.
;   blank -> the built-in 8x8 two-color pattern
; Overridden for one run by --wallpaper=PATH, and by the KITTYTK_WALLPAPER
; environment variable (which wins over both) — the quickest way to try one.
wallpaper =

; How the wallpaper covers the desktop.
;
; wallpaper_mode  natural  -> the image's own pixel size (the default)
;                 fit_both -> scaled to fit INSIDE, aspect kept, nothing cropped
;                 fit_width / fit_height -> that axis matches, aspect kept
;                 cover    -> smallest that covers everything, overflow cropped
;                 stretch  -> each axis filled exactly (the only mode that distorts)
wallpaper_mode =
;
; wallpaper_scale multiplies whatever size the mode arrives at: 0.5 halves it,
; 2 doubles it. Blank means 1.
wallpaper_scale =
;
; wallpaper_tile  which axes repeat: both (default), none, horizontal, vertical.
; An axis that does not repeat shows one copy and leaves the rest bare.
wallpaper_tile =
;
; wallpaper_align anchors the copy. Names ("center", "top left", "bottom",
; "right top") or fractions per axis ("0.25 0.75", where 0 is left/top,
; 0.5 centre, 1 right/bottom). On an axis that TILES this sets the phase of
; the repetition rather than confining it. Blank means centred.
wallpaper_align =
;
; wallpaper_filter  crisp (default, hard pixel edges) or smooth (interpolated).
; Only matters when the drawn size differs from the image's own — the built-in
; 8x8 pattern draws 1:1, where smoothing would only blur it.
; Not "wallpaper_scaling" — wallpaper_scale above is a NUMBER and unrelated.
wallpaper_filter =

[service]
; Where the display host listens for applications.
;   blank            -> the recommended default (loopback TCP on Windows,
;                       a local socket elsewhere)
;   tcp://0.0.0.0:9797 -> plaintext TCP on all interfaces (LAN; no encryption)
;   tls://0.0.0.0:9797 -> encrypted TCP (fingerprint-pinned)
; The KITTYTK_DISPLAY environment variable, if set, overrides this.
endpoint =
; Optional shared secret that lets a client connect without a prompt.
; The KITTYTK_TOKEN environment variable, if set, overrides this.
token =

[system]
; Menu shortcut style for the graphical host (kittytk-sdl).
;   true  -> native macOS glyphs (⌃⌥⇧⌘, ordered ⌃⌥⇧⌘) when running ON macOS
;   mac   -> force the native macOS glyphs on any operating system
;   blank -> the default compact notation (^X, M-x, S-Tab)
native =

[tui]
; The same knob for the terminal host (kittytk-tui), independent of [system].
native =

; Key bindings. Unlike the settings above, the names on the LEFT are data —
; a key as the input layer reports it — so this section is read by section,
; not by key name. Write a key on the left and the operation it runs on the
; right; anything listed here replaces the built-in binding for that key.
;
; Key spelling: modifiers are prefixes — M- Meta/Alt, S- Shift, s- Super/
; Command, C- Control (^X also spells Control for a letter). Punctuation may
; be written as a word (Minus, Plus, Equals, Slash, …), which is what lets
; s-Minus be written at all — a bare - is the modifier separator.
;
; These are the defaults. Deleting a line does not unbind the key, it restores
; the default; bind it to nothing to turn it off.
[mappings]
M-F10 = window_maximize_toggle
; Ending the APPLICATION versus closing one of its WINDOWS. Quitting an app
; closes its windows and takes it off the desktop; the desktop itself lives on,
; unless there is no desktop to go back to (solo mode) and this was the last
; app left. ^F4 is the same key as C-F4, and ^Q the same as C-Q.
M-F4 = app_quit
^Q = app_quit
^F4 = window_close
^W = window_close
F10 = app_menu
C-Tab = window_mdi_next
C-S-Tab = window_mdi_prior
M-Tab = window_next
M-S-Tab = window_prior
s-M = app_minimize
s-Minus = gui_scale_down
s-Plus = gui_scale_up
s-0 = gui_scale_reset
Tab = focus_next
S-Tab = focus_prior
Esc = window_cancel_resize
; The HOME ROW's key. The keypad's is a different physical key named "Enter";
; bind it too if you want the keypad to activate as well.
Return = trinket_activate
Space = trinket_activate
Up = window_move_fine_up
Down = window_move_fine_down
Left = window_move_fine_left
Right = window_move_fine_right
S-Up = window_size_fine_up
S-Down = window_size_fine_down
S-Left = window_size_fine_left
S-Right = window_size_fine_right
; Coarse move and size. Several keys may name the same command — just bind
; each one. The big modifiers are interchangeable here, which is what the
; hand-written handler did before these were bindings: Ctrl, Meta and
; Super all meant "chunky step".
C-Up = window_move_up
M-Up = window_move_up
s-Up = window_move_up
C-Down = window_move_down
M-Down = window_move_down
s-Down = window_move_down
C-Left = window_move_left
M-Left = window_move_left
s-Left = window_move_left
C-Right = window_move_right
M-Right = window_move_right
s-Right = window_move_right
C-S-Up = window_size_up
M-S-Up = window_size_up
S-s-Up = window_size_up
C-S-Down = window_size_down
M-S-Down = window_size_down
S-s-Down = window_size_down
C-S-Left = window_size_left
M-S-Left = window_size_left
S-s-Left = window_size_left
C-S-Right = window_size_right
M-S-Right = window_size_right
S-s-Right = window_size_right
