[window]
title  = KittyTK
width  = 1024
height = 768
scale  = 2
font_size = 12
; Graphical window frame border thickness, in device pixels. Blank or 0
; keeps the default thin frame; raise it for a heavier window outline.
border_width =
; fps = true shows the render frame rate in the OS title bar (kittytk-sdl).
; It runs a continuous repaint (burn) loop, so the reading is a steady,
; vsync-paced rate (usually the monitor refresh) - useful for measurement, but
; it uses CPU/GPU even when idle. Blank/false = off (no burn loop).
fps =
; vsync syncs presents to the display refresh. On by default (caps fps at the
; monitor refresh). vsync = false uncaps it, so fps=true can show raw
; throughput past the refresh rate.
vsync =
; Which keys are window accelerators rather than input for whatever has focus.
; A pattern: M-* claims every Meta combination.
accelerator_chord = M-*
[service]
endpoint =      ; blank = default; tcp://…, tls://…, or a socket path
token =

[tui]
; Terminal clipboard integration. Blank/osc52/system mirrors Copy/Cut to the
; terminal's clipboard via OSC 52 (iTerm2, xterm, kitty, tmux, …). osc52-paste
; (or full) additionally queries the terminal on Paste (read-back), falling
; back to the internal clipboard if the terminal stays silent. internal/off
; keeps a host-internal clipboard only.
clipboard =

; Key bindings. The names on the left are data (a key as the input layer
; reports it), so this section is read by section rather than by key name.
; Modifiers are prefixes: M- Meta/Alt, S- Shift, s- Super/Command, C- Control.
; Punctuation may be spelled as a word (Minus, Plus, …), since a bare - is the
; modifier separator. These are the defaults.
[mappings]
M-F10 = window_maximize_toggle
M-F4 = window_close
F10 = app_menu
C-Tab = window_next
C-S-Tab = window_prior
M-Tab = window_next
M-S-Tab = window_prior
s-M = app_minimize
s-Minus = gui_scale_down
s-Plus = gui_scale_up
s-0 = gui_scale_reset
Tab = focus_next
S-Tab = focus_prior
Esc = window_cancel_resize
Enter = trinket_activate
Space = trinket_activate
Up = window_move_fine_up
Down = window_move_fine_down
Left = window_move_fine_left
Right = window_move_fine_right
S-Up = window_size_fine_up
S-Down = window_size_fine_down
S-Left = window_size_fine_left
S-Right = window_size_fine_right
C-Up = window_move_up
C-Down = window_move_down
C-Left = window_move_left
C-Right = window_move_right
C-S-Up = window_size_up
C-S-Down = window_size_down
C-S-Left = window_size_left
C-S-Right = window_size_right
