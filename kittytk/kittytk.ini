[window]
renderer = webgpu

# Mirrors mew's [options] section, for the two knobs that mean the same thing on
# either side of the wire. Both spellings are read: rtlMarkMode as mew writes
# it, rtl_mark_mode in this file's own style.
#
# Only a cell target is affected. The graphical host composes combining marks
# properly and has no terminal to disagree with, so neither key changes it.
[options]

# rtlMarkMode: how the marks that ride a right-to-left letter are prepared.
# "compose" folds a cluster's points (dagesh, shin and sin dots, rafe,
# holam-haser) into their letter's presentation form, so nothing is left
# free-standing for a terminal to misplace. Unset leaves them as written.
# rtlMarkMode = compose

# rtlCombining: whether those marks are shown at all. On by default.
#
# A terminal that runs its own bidi over what it is sent miscounts a background
# fill over any line still carrying them, so a selection bar, a highlight or a
# gutter drifts off the cells it was meant for. The marks are the only part of
# such a line that can be given up -- turn this off and pointed Hebrew renders
# one codepoint per cell, the way pre-shaped Arabic already does, and every fill
# lands where it was put. Under rtlMarkMode = compose the points survive even
# so, folded into their letters; only the vowels and accents go.
# rtlCombining = false
