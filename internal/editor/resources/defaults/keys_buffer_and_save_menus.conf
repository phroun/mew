# ============= Buffer Menu ============
@author "mew defaults"
help	="keys"
esc help="keys_nerd"
^B help	="keys_buffer"
^B U	=zone_prior
^B V	=zone_next
^B ;    =viewport_prior
^B '    =viewport_next

^B H    =help_toggle "help:/"
^B M    =main|memo

^B L	=buffer_list
^B E	=buffer_new
^B O	=buffer_open_file
^B A	=buffer_save_all true
^B X	=buffer_save_all & exit
^B S	=buffer_save
^B W	=buffer_write
^B B	=buffer_save_as
^B C	=buffer_duplicate
^B R	=buffer_insert_file
^B -	=buffer_undo
^B \=   =buffer_redo
^B |	=buffer_revert
^B [	=nav_history_prior
^B ]	=nav_history_next

^B F    =nav_follow
# Link-to-link stepping under the ^B prefix. Bare tab / S-tab already do this
# (keys_system.conf) but only when nothing earlier in their chain claims the
# key; these reach it unconditionally, and are what the Viewport menu teaches.
^B tab   =nav_next
^B S-tab =nav_prior
^B Q    =wiki_find
^B T	=viewport_pty_toggle|shell

^B 5	=viewport_equalize
^B %	=viewport_balance
^B {	=viewport_contract
^B }	=viewport_expand
^B G	=viewport_flip
^B g	=viewport_reverse
^B J	=viewport_left
^B K	=viewport_right
^B P	=viewport_up
^B N	=viewport_down

^B 0	=viewport_shrink
^B Z	=viewport_zoom

^B 1	=viewport_monocle
^B !	=viewport_local_monocle
^B 2	=viewport_split_down
^B @	=viewport_split_up
^B 3	=viewport_split_right
^B #	=viewport_split_left
^B space=viewport_split pending
^B esc	=viewport_new pending
^B 4	=viewport_spectacle
^B $	=viewport_local_spectacle
^B `	=viewport_merge pending
^B ~	=viewport_swap pending
^B ,	=viewport_tab_prior
^B .	=viewport_tab_next
^B <	=viewport_move_tab_prior
^B >	=viewport_move_tab_next
