# ============= Buffer Menu ============
@author "mew defaults"
help	="keys"
esc help="keys_nerd"
^B help	="keys_buffer"
^B P    =viewport_prior
^B N    =viewport_next

^B H    =help_toggle "help:/"
^B M    =main|memo

^B L	=buffer_list
^B E	=buffer_new
^B O	=buffer_open_file
^B A	=buffer_save_all true
^B X	=buffer_save_all & exit
^B S	=buffer_save
^B W	=buffer_write
^B B	=buffer_save_as
^B C	=buffer_duplicate
^B 2	=viewport_clone
^B R	=buffer_insert_file
^B -	=buffer_undo
^B \=   =buffer_redo
^B ~	=buffer_revert
^B [	=nav_history_prior
^B ]	=nav_history_next

^B F    =nav_follow
^B Q    =wiki_find
^B U    =stat_peek_up
^B V    =stat_peek_down
