@author "mew defaults"

^Q H	=help_toggle
esc X	=cmd

# Raw Key Input: the NEXT key goes to whatever is running inside the focused
# viewport instead of running mew's binding for it. With a terminal focused
# the capture layer already passes ordinary keys through, so what this is for
# is the keys the capture layer CANNOT reach: a sequence starter held as a
# possible chord (^B, ^K) that you want the child to receive literally.
#
# Meta rather than Super: Super does not survive the trip through a terminal
# (no encoding carries it), so a mew hosted inside another mew could never be
# sent its own escape hatch. Meta is a real escape sequence the whole way
# down. \\ is the ASCII backslash, not the Super modifier.
M-\\	=raw_key_input
esc y	=kill_ring_yank
esc Y	=kill_ring_pop

# "false" keeps these GATED on a focused link button, so they yield to the
# rest of the chain when the caret is not on a link. Bare nav_next /
# nav_prior always act, which is what the ^B tab / ^B S-tab bindings want.
S-tab	=nav_prior false|smart_unindent
tab	=nav_next false|completion|insert '\t'
return	=nav_follow false|accept|insert_newline
^C	=cancel|viewport_close
^R	=repeat_next
^@	=insert ' '; go_char_prior
esc >	=scroll_right
esc <	=scroll_left

^S	=search
^L	=find_next
^]	=go_match

^_	=buffer_undo
^/	=buffer_undo
^Z	=buffer_redo|buffer_undo
