@author "mew defaults"

^Q H	=help_toggle
esc X	=cmd

# Raw Key Input: the NEXT key goes to whatever is running inside the focused
# viewport instead of running mew's binding for it — the escape hatch for the
# keys mew itself claims (^Y, ^K, ^W...) when a terminal is what you are
# actually typing at. Super is deliberate: it is the one modifier mew binds
# nothing else under, so this stays available whatever else is rebound.
s-\\	=raw_key_input
esc y	=kill_ring_yank
esc Y	=kill_ring_pop

# "false" keeps these GATED on a focused link button, so they yield to the
# rest of the chain when the caret is not on a link. Bare nav_next /
# nav_prior always act, which is what the ^B tab / ^B S-tab bindings want.
S-tab	=nav_prior false|smart_unindent
tab	=nav_next false|completion|insert '\t'
return	=nav_follow false|accept|insert_newline
^C	=cancel|buffer_close
^R	=repeat_next
^@	=insert ' '; go_char_prior
esc >	=scroll_right
esc <	=scroll_left

^S	=search
^L	=find_next
^]	=go_match

^_	=buffer_undo
^/	=buffer_undo
^Z	=buffer_redo|buffer_undo
