# ============= Block Menu ============
@author "mew defaults"
^K help ="keys_block"
^K B	=set_block_begin
^K K	=set_block_end
^K C	=block_copy
^K M	=block_move
^K Y	=block_delete
^K R	=block_from_file
^K W	=block_write
^K X	=os_exchange
^K .	=block_indent
^K ,	=block_unindent

# Planned, not written yet. Bound to not_implemented so the key answers the
# same way the menu item does - a warning naming what was asked for - rather
# than the menu advertising a key that silently does nothing.
^K J	=not_implemented "Justify Block"
^K /	=not_implemented "Filter Block through Cmd"
^K T	=not_implemented "Convert to UPPERCASE"
^K _	=not_implemented "Swap camelCase snake_case"
